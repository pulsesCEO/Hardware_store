<div class="p-6 md:p-10 max-w-4xl mx-auto w-full">
  <!-- Header with Back Button -->
  <div class="flex items-center mb-8">
    <button (click)="cancel()" class="mr-4 p-2.5 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-all shadow-sm group">
      <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </button>
    <div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">{{ editingId ? 'Edit Product' : 'Add New Product' }}</h1>
      <p class="text-gray-500 text-sm mt-1">Fill in the inventory item details.</p>
    </div>
  </div>

  @if (message) {
    <div class="px-4 py-3 rounded-xl mb-6 shadow-sm border flex items-center"
         [ngClass]="isError ? 'bg-red-50 border-red-200 text-red-700' : 'bg-green-50 border-green-200 text-green-700'">
      {{ message }}
    </div>
  }

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-8">
      
      <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Product Details</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 mb-8">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Item SKU / Code <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="product.sku" placeholder="e.g. ITM-001" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Item Name <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="product.name" placeholder="e.g. OPC Cement" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Unit of Measurement <span class="text-red-500">*</span></label>
          <select [(ngModel)]="product.unit_id" 
                  class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option [ngValue]="null" disabled>Select a Unit</option>
            @for (unit of units; track unit.id) {
              <option [ngValue]="unit.id">{{ unit.name }} ({{ unit.short_name }})</option>
            }
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">GST / Tax Rate</label>
          <select [(ngModel)]="product.gst_id" 
                  class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option [ngValue]="null" disabled>Select GST Rate</option>
            @for (gst of gstList; track gst.id) {
              <option [ngValue]="gst.id">{{ gst.tax_name }} ({{ gst.tax_rate }}%)</option>
            }
          </select>
        </div>

        <!-- HIDE Opening Stock if Inventory Module is OFF -->
        @if (isInventoryEnabled) {
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Opening Stock</label>
            <input type="number" [(ngModel)]="product.stock_level" placeholder="0" 
                   class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        }
      </div>

      <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Pricing</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Cost Price (₹)</label>
          <input type="number" [(ngModel)]="product.cost_price" placeholder="0" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Selling Price (₹)</label>
          <input type="number" [(ngModel)]="product.selling_price" placeholder="0" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <!-- HIDE Low Stock Alert if Inventory Module is OFF -->
        @if (isInventoryEnabled) {
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Low Stock Alert Level</label>
            <input type="number" [(ngModel)]="product.min_stock" placeholder="5" 
                   class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        }
      </div>

    </div>

    <div class="px-8 py-5 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
      <button (click)="cancel()" class="px-6 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 font-medium transition-all shadow-sm">Cancel</button>
      <button (click)="saveProduct()" [disabled]="isSaving" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-xl shadow-lg shadow-blue-500/30 font-medium transition-all hover:-translate-y-0.5 disabled:opacity-50">
        {{ isSaving ? 'Saving...' : 'Save Product' }}
      </button>
    </div>
  </div>
</div>
